name: Project 1 CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "projects/project-1/**"
      - ".github/workflows/project-1-ci.yml"
  push:
    paths:
      - "projects/project-1/**"
      - ".github/workflows/project-1-ci.yml"

concurrency:
  group: project-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/project-1

jobs:
  verify:
    name: Fast suite and JMH harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
      - name: Verify application
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify JMH harness
        run: ./mvnw --batch-mode --no-transfer-progress -Pjmh-smoke -Dtest=JmhSmokeTest test
      - name: Check whitespace
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- projects/project-1 .github/workflows/project-1-ci.yml
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git show --check --format= "${{ github.sha }}" -- projects/project-1 .github/workflows/project-1-ci.yml
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            git show --check --format= "${{ github.sha }}" -- projects/project-1 .github/workflows/project-1-ci.yml
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}" -- projects/project-1 .github/workflows/project-1-ci.yml
          fi
      - name: Upload reports after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-1-fast-test-reports
          path: projects/project-1/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  mutation-testing:
    name: Domain mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
      - name: Check assertion strength with PIT
        # Osobny job nie dziedziczy target/ z verify; PIT potrzebuje skompilowanych klas i testów.
        run: ./mvnw --batch-mode --no-transfer-progress -Pmutation-testing clean test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-1-pit-report
          path: projects/project-1/target/pit-reports/**
          if-no-files-found: warn
          retention-days: 14

  infrastructure-tests:
    name: PostgreSQL, Redis and MongoDB contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
      - name: Verify real infrastructure and full HTTP smoke flow
        run: ./mvnw --batch-mode --no-transfer-progress -Pinfrastructure-tests verify
      - name: Upload reports after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-1-infrastructure-test-reports
          path: projects/project-1/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  service-load-smoke:
    name: Whole-service k6 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "2.1.0"
      - run: chmod +x mvnw
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Build application
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Start load-test profile
        env:
          JWT_SECRET: ci-load-test-secret-with-at-least-32-characters
        run: |
          nohup java -jar target/booking-capacity-platform-0.1.0-SNAPSHOT.jar --spring.profiles.active=load-test > application.log 2>&1 &
          echo $! > application.pid
      - name: Wait for HTTP readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
              'http://localhost:8080/api/events?city=Warsaw&from=2026-01-01T00:00:00Z&category=education' > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat application.log
          exit 1
      - name: Run controlled k6 smoke
        env:
          BASE_URL: http://localhost:8080
          TEST_TYPE: smoke
          EVENT_CAPACITY: 100
        run: k6 run performance/k6/reservation-load.js
      - name: Upload application log after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-1-load-smoke-log
          path: projects/project-1/application.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop application and PostgreSQL
        if: always()
        run: |
          if [[ -f application.pid ]]; then
            kill "$(cat application.pid)" 2>/dev/null || true
          fi
          docker compose stop
