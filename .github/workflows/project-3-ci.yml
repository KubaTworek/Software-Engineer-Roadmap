name: Project 3 CI

on:
  workflow_dispatch:
  push:
    paths: ['projects/project-3/**', '.github/workflows/project-3-ci.yml']
  pull_request:
    paths: ['projects/project-3/**', '.github/workflows/project-3-ci.yml']

jobs:
  fast-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-3
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Reject whitespace errors in the submitted change
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff-tree --check --root -r HEAD
          fi
        working-directory: .
      - run: docker compose config --quiet
      - name: Validate identity overlay and SLO alert behavior
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile apps config --quiet
          docker run --rm --entrypoint /bin/promtool --workdir /work/observability/prometheus/tests -v "$PWD:/work:ro" prom/prometheus:v2.55.1 test rules checkout-slo.test.yml

  operational-exercises:
    if: github.event_name == 'workflow_dispatch'
    needs: fast-verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: roadmap-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_PARALLEL_LIMIT: 2
    defaults:
      run:
        working-directory: projects/project-3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress -pl common -am -DskipTests package
      - run: docker compose --profile apps up --detach --build --wait
      - name: Sustained workload, broker outage, recovery and unit cost
        shell: pwsh
        run: |
          ./scripts/endurance-drill.ps1 -SteadySeconds 120 -OutageSeconds 15 -RecoverySeconds 120 -Rate 2
          docker compose -f docker-compose.yml -f docker-compose.cost-candidate.yml --profile apps up --detach --wait
          ./scripts/endurance-drill.ps1 -SteadySeconds 120 -OutageSeconds 15 -RecoverySeconds 120 -Rate 2 -EstimatedHourlyCost 0.975
          $comparison = 'scenario,seconds,cost,currency,eligible,good,completed,p99Millis'
          Get-ChildItem target/endurance/*.csv | ForEach-Object { $comparison += "`n" + ((Get-Content $_.FullName | Select-Object -Skip 1) -join "`n") }
          Set-Content target/endurance/comparison.csv $comparison
          java -cp common/target/classes pl.jakubtworek.backend.common.operations.UnitEconomics target/endurance/comparison.csv 0.999 3000
      - name: Real identity through every HTTP boundary
        shell: pwsh
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile apps up --detach --wait
          ./scripts/identity-drill.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-3-operational-observations
          path: projects/project-3/target/endurance/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop private exercise environment
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile '*' down --volumes --remove-orphans

  infrastructure-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress -Pinfrastructure-tests verify

  system-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-3
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete application
        run: docker compose --profile apps up --detach --build --wait
      - name: Verify saga, outbox, inbox and durable payment
        run: bash ./scripts/smoke-test.sh
      - name: Preserve diagnostic logs after a failure
        if: failure()
        run: docker compose --profile apps logs --no-color
      - name: Stop the environment
        if: always()
        run: docker compose --profile apps down --volumes

  terraform-static-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-3/infra/aws/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.9.8'}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
