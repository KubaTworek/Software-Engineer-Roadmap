name: project-2

on:
  workflow_dispatch:
  push:
    paths: ['projects/project-2/**', '.github/workflows/project-2-ci.yml']
  pull_request:
    paths: ['projects/project-2/**', '.github/workflows/project-2-ci.yml']

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make the Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Unit, architecture and infrastructure contracts
        run: ./gradlew clean test integrationTest --no-daemon
      - name: Dependency inventory for audit and SBOM input
        run: ./gradlew dependencies --configuration runtimeClasspath --no-daemon
      - name: Whitespace guard
        working-directory: .
        run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-2-test-reports
          path: projects/project-2/build/reports/tests

  cdc-contract:
    name: PostgreSQL WAL to Debezium and Kafka
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/project-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make the Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Verify the real CDC pipeline
        run: ./gradlew cdcIntegrationTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: project-2-cdc-test-report
          path: projects/project-2/build/reports/tests/cdcIntegrationTest
          if-no-files-found: ignore
          retention-days: 7
