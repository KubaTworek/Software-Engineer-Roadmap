name: Backend Engineering CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"
  pull_request:
    paths:
      - "backend-engineering/**"
      - ".github/workflows/backend-engineering-ci.yml"
  push:
    paths:
      - "backend-engineering/**"
      - ".github/workflows/backend-engineering-ci.yml"

concurrency:
  group: backend-engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace errors in the submitted changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- backend-engineering
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            git show --check --format= "${{ github.sha }}" -- backend-engineering
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}" -- backend-engineering
          fi

  maven-verify:
    name: ${{ matrix.name }} (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core laboratories
            java: 21
            pom: pom.xml
          - name: Stage 2C reference delivery flow
            java: 21
            pom: src/main/java/pl/jakubtworek/backend_engineering/stage_2/block_c/workshop/pom.xml
          - name: Stage 3C cloud architecture
            java: 21
            pom: src/main/java/pl/jakubtworek/backend_engineering/stage_3/block_c/pom.xml
    defaults:
      run:
        working-directory: backend-engineering
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress -f "${{ matrix.pom }}" verify
      - name: Upload test reports after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.java }}-${{ strategy.job-index }}
          path: backend-engineering/**/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  infrastructure-tests:
    name: Infrastructure contracts (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend-engineering
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Verify PostgreSQL, Redis, Kafka and OpenSearch contracts
        run: ./mvnw --batch-mode --no-transfer-progress -Pinfrastructure-tests verify
      - name: Upload infrastructure test reports after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-infrastructure-java-21
          path: backend-engineering/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  security-scan:
    name: SBOM and dependency vulnerability scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend-engineering
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Generate SBOM and scan runtime dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          args=(--batch-mode --no-transfer-progress -Psecurity-scan -DskipTests verify)
          if [[ -n "$NVD_API_KEY" ]]; then
            args+=("-DnvdApiKey=$NVD_API_KEY")
          fi
          ./mvnw "${args[@]}"
      - name: Upload SBOM and vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-engineering-security-reports
          path: |
            backend-engineering/target/backend-engineering-sbom.json
            backend-engineering/target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 14
