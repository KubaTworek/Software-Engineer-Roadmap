services:
  postgres:
    image: postgres:16-alpine
    container_name: ride-postgres
    environment:
      POSTGRES_DB: ridesharing
      POSTGRES_USER: rides
      POSTGRES_PASSWORD: rides
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rides -d ridesharing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ride-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: ride-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ridesharing
      SPRING_DATASOURCE_USERNAME: rides
      SPRING_DATASOURCE_PASSWORD: rides
      SPRING_DATA_REDIS_HOST: redis
      APP_JWT_SECRET: change-me-change-me-change-me-change-me-change-me
    ports:
      - "8080:8080"
    profiles: ["app"]

volumes:
  postgres_data:
  redis_data:
