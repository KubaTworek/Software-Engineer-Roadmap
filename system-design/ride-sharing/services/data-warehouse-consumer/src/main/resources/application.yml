server:
  port: 8085
spring:
  application:
    name: data-warehouse-consumer
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: data-warehouse-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
  datasource:
    url: ${WAREHOUSE_DATASOURCE_URL:jdbc:postgresql://localhost:5434/rides_warehouse}
    username: ${WAREHOUSE_DATASOURCE_USERNAME:warehouse}
    password: ${WAREHOUSE_DATASOURCE_PASSWORD:warehouse}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
