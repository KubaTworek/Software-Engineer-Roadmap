services:
  core-api-eu-central:
    extends:
      file: docker-compose.yml
      service: core-api
    container_name: core-api-eu-central
    ports:
      - "8180:8080"
    environment:
      APP_REGION: eu-central
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-core:5432/ridesharing
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  core-api-us-east:
    extends:
      file: docker-compose.yml
      service: core-api
    container_name: core-api-us-east
    ports:
      - "8280:8080"
    environment:
      APP_REGION: us-east
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-core-us:5432/ridesharing
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-us:29092

  postgres-core-us:
    image: postgres:16
    environment:
      POSTGRES_DB: ridesharing
      POSTGRES_USER: rides
      POSTGRES_PASSWORD: rides
    ports:
      - "5442:5432"

  kafka-us:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9192:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-us:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka-us:29092,CONTROLLER://kafka-us:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-us:29092,PLAINTEXT_HOST://localhost:9192
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
