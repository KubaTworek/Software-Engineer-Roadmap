spring:
  datasource:
    url: jdbc:h2:mem:chatdbtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: "test-secret-must-be-at-least-32-characters-long"
    expiration-minutes: 60
  media:
    local-dir: ./target/test-uploads
  outbox:
    batch-size: 100
    max-attempts: 5
    publish-delay-ms: 60000
    consume-delay-ms: 60000
