spring:
  datasource:
    url: ${CHAT_DB_URL:jdbc:postgresql://localhost:5432/chat}
    username: ${CHAT_DB_USER:chat}
    password: ${CHAT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
