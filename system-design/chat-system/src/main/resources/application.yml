spring:
  application:
    name: chat-system-stage1
  datasource:
    url: jdbc:h2:mem:chatdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  jwt:
    # For local development only. Use a strong secret from env/secrets manager in production.
    secret: "local-dev-secret-must-be-at-least-32-characters-long-change-me"
    expiration-minutes: 1440
