services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/video
      DATABASE_USERNAME: video
      DATABASE_PASSWORD: video
      # For app-in-Docker, this works on Docker Desktop and Linux with extra_hosts below.
      # For fully portable local development, run only postgres+minio in Docker and run the app on the host.
      S3_ENDPOINT: http://host.docker.internal:9000
      S3_PUBLIC_ENDPOINT: http://host.docker.internal:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: video-streaming
      CDN_BASE_URL: http://localhost:9000/video-streaming
      JWT_SECRET: dev-secret-dev-secret-dev-secret-dev-secret-dev-secret
      FFMPEG_PATH: ffmpeg
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
