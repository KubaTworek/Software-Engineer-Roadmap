global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/video-alerts.yml

scrape_configs:
  - job_name: 'video-api'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:8080']
  - job_name: 'video-worker'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['worker:8081']
