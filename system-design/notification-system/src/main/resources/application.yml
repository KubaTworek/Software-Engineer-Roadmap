server:
  port: 8080

spring:
  application:
    name: notification-system
  datasource:
    url: jdbc:h2:mem:notifications;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true

notification:
  worker:
    fixed-delay-ms: 1000
    lease-seconds: 30
  outbox:
    fixed-delay-ms: 700
    max-attempts: 8
  retry:
    max-attempts: 3
    base-delay-ms: 1500
  deduplication:
    window-minutes: 10
  rate-limit:
    tenant-per-minute: 60
    user-per-minute: 20
  digest:
    fixed-delay-ms: 2000
    window-seconds: 30
  campaign:
    batch-size: 100
    claim-seconds: 60
  admission:
    provider-inflight: 20
    tenant-inflight: 10
  reconciliation:
    fixed-delay-ms: 5000
  archive:
    fixed-delay-ms: 10000
    retention-seconds: 120
  webhook:
    signing-secret: "educational-only-change-me"
    previous-signing-secret: ""
    inbox-retry-ms: 5000
    inbox-max-attempts: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [tenant=%X{tenantId:-},traceId=%X{traceId:-},spanId=%X{spanId:-}]"
