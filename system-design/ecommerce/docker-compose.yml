services:
  postgres-writer:
    image: postgres:16
    container_name: ecommerce-postgres-writer
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - ecommerce-postgres-writer-data:/var/lib/postgresql/data

  postgres-replica-1:
    image: postgres:16
    container_name: ecommerce-postgres-replica-1
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5433:5432"
    volumes:
      - ecommerce-postgres-replica-1-data:/var/lib/postgresql/data
    # Demo only. Real read replicas require streaming replication or managed cloud replicas.

  postgres-replica-2:
    image: postgres:16
    container_name: ecommerce-postgres-replica-2
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports:
      - "5434:5432"
    volumes:
      - ecommerce-postgres-replica-2-data:/var/lib/postgresql/data
    # Demo only. Real read replicas require streaming replication or managed cloud replicas.

  redis:
    image: redis:7
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ecommerce-redis-data:/data

  opensearch:
    image: opensearchproject/opensearch:2
    container_name: ecommerce-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "admin"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - ecommerce-opensearch-data:/usr/share/opensearch/data

  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  ecommerce-postgres-writer-data:
  ecommerce-postgres-replica-1-data:
  ecommerce-postgres-replica-2-data:
  ecommerce-redis-data:
  ecommerce-opensearch-data:
