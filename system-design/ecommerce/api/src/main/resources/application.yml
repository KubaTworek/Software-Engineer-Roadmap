spring:
  application:
    name: ecommerce-api

  datasource:
    url: jdbc:h2:mem:ecommerce;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: simple
    cache-names:
      - categories
      - products
      - productBySlug
      - searchResults
      - catalogHome
      - productDetails
      - categoryTree

  data:
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379
      timeout: 2s

server:
  port: 8080

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-},spanId=%X{spanId:-}] "

app:
  security:
    token-ttl-hours: 24

  opensearch:
    enabled: false
    base-url: http://localhost:9200
    username: admin
    password: admin
    products-index: products

  outbox:
    publisher-enabled: false
    fixed-delay-ms: 5000
    batch-size: 50

  integrations:
    retry:
      max-attempts: 3
      initial-delay-ms: 500
      multiplier: 2.0

  inventory:
    expiration-worker:
      enabled: true
      fixed-delay-ms: 30000
      batch-size: 100

  payments:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:educational-local-secret}
    max-webhook-age: 5m
    reconciliation:
      enabled: false
      fixed-delay-ms: 60000

  cdn:
    enabled: false
    base-url: https://cdn.example.com
    origin-base-url: https://assets.example.com
    version: v1

  catalog-cache:
    warmer-enabled: true
    warmer-fixed-delay-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ecommerce-api
  tracing:
    sampling:
      probability: 1.0

  stage4:
    erp:
      enabled: true
    wms:
      enabled: true
    dynamic-pricing:
      enabled: true
    loyalty:
      points-per-pln: 1
    marketplace:
      enabled: true
