spring:
  application:
    name: ecommerce-java-mvp

  datasource:
    url: jdbc:h2:mem:ecommerce
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  security:
    token-ttl-hours: 24
