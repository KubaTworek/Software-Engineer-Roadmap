spring:
  application:
    name: file-storage-stage1
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/filestorage}
    username: ${DB_USERNAME:filestorage}
    password: ${DB_PASSWORD:filestorage}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:file-storage}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}

spring.servlet.multipart:
  max-file-size: 100MB
  max-request-size: 100MB
