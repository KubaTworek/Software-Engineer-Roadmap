spring:
  application:
    name: file-storage-stage6
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/filestorage}
    username: ${DB_USERNAME:filestorage}
    password: ${DB_PASSWORD:filestorage}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:file-storage-projection}
      enable-auto-commit: false
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:file-storage}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  upload:
    cleanup-fixed-delay-ms: ${UPLOAD_CLEANUP_FIXED_DELAY_MS:900000}
  sharing:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  production:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
    cdn:
      enabled: ${CDN_ENABLED:false}
      base-url: ${CDN_BASE_URL:}
      signed-url-ttl-seconds: ${CDN_SIGNED_URL_TTL_SECONDS:300}
      signing-secret: ${CDN_SIGNING_SECRET:change-this-cdn-signing-secret-32}
    antivirus:
      enabled: ${ANTIVIRUS_ENABLED:false}
      mode: ${ANTIVIRUS_MODE:NOOP}
      clamd-host: ${CLAMD_HOST:localhost}
      clamd-port: ${CLAMD_PORT:3310}
    thumbnails:
      enabled: ${THUMBNAILS_ENABLED:true}
      max-width: ${THUMBNAIL_MAX_WIDTH:320}
      max-height: ${THUMBNAIL_MAX_HEIGHT:320}
    outbox:
      publish-fixed-delay-ms: ${OUTBOX_PUBLISH_FIXED_DELAY_MS:5000}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    events:
      adapter: ${EVENT_PUBLISHER_ADAPTER:logging}
      topic: ${FILE_EVENTS_TOPIC:file-storage.events.v1}
      consumer-enabled: ${FILE_EVENTS_CONSUMER_ENABLED:false}
    workers:
      enabled: ${BACKGROUND_WORKERS_ENABLED:true}
      processing-fixed-delay-ms: ${PROCESSING_WORKER_FIXED_DELAY_MS:10000}
      gc-fixed-delay-ms: ${GC_WORKER_FIXED_DELAY_MS:300000}
    backup:
      local-dir: ${BACKUP_LOCAL_DIR:/tmp/file-storage-backups}
    kms:
      master-key: ${LOCAL_KMS_MASTER_KEY:change-this-local-dev-master-key-32}
