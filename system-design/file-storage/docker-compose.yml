services:
  postgres:
    image: postgres:16-alpine
    container_name: file-storage-postgres
    environment:
      POSTGRES_DB: filestorage
      POSTGRES_USER: filestorage
      POSTGRES_PASSWORD: filestorage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filestorage -d filestorage"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: file-storage-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10


  clamav:
    image: clamav/clamav:1.4
    container_name: file-storage-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    profiles: ["security"]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: file-storage-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles: ["ops"]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: file-storage-grafana
    ports:
      - "3000:3000"
    profiles: ["ops"]

volumes:
  postgres_data:
  minio_data:
  clamav_data:
