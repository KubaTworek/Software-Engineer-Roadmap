spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: url_shortener
    password: url_shortener
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

app:
  public-base-url: http://localhost:8080
  cache:
    url-ttl: PT24H
  rate-limit:
    create:
      requests: 10
      window: PT1M
    redirect:
      requests: 600
      window: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health,info
