spring:
  datasource:
    url: jdbc:h2:mem:url_shortener;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 100ms
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  main:
    banner-mode: off

app:
  public-base-url: http://sho.rt
  cache:
    url-ttl: PT1H
  rate-limit:
    create:
      requests: 10000
      window: PT1M
    redirect:
      requests: 10000
      window: PT1M
