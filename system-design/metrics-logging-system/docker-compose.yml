services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: telemetry-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: bitnami/kafka:3.7
    container_name: telemetry-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  telemetry-server:
    build:
      context: .
      dockerfile: telemetry-server/Dockerfile
    container_name: telemetry-server
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/observability
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      TELEMETRY_RETENTION_DAYS: 30

  telemetry-agent:
    build:
      context: .
      dockerfile: telemetry-agent/Dockerfile
    container_name: telemetry-agent
    depends_on:
      - telemetry-server
    environment:
      AGENT_SERVER_URL: http://telemetry-server:8080
      AGENT_TENANT_ID: demo
      AGENT_SERVICE_NAME: demo-agent
      AGENT_LOG_FILE: /var/log/demo/demo.log
    volumes:
      - ./logs:/var/log/demo
    profiles: ["agent"]

volumes:
  clickhouse_data:
