server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: telemetry-server
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: telemetry-server
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/observability}
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

telemetry:
  kafka:
    logs-topic: logs.raw
    metrics-topic: metrics.raw
  retention-days: ${TELEMETRY_RETENTION_DAYS:30}
  query:
    default-limit: 100
    max-limit: 5000
  alerting:
    evaluation-interval-ms: 30000
