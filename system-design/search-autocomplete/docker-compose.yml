services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      AUTOCOMPLETE_OPERATOR_PASSWORD: "{noop}change-me-locally"
      AUTOCOMPLETE_PRIVACY_HMAC_KEY: "local-compose-key-change-me"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
