server:
  port: 8080

spring:
  application:
    name: search-autocomplete

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: search-autocomplete

app:
  privacy:
    hmac-key: ${AUTOCOMPLETE_PRIVACY_HMAC_KEY:local-development-key-change-me}
  security:
    operator:
      username: ${AUTOCOMPLETE_OPERATOR_USERNAME:operator}
      password: ${AUTOCOMPLETE_OPERATOR_PASSWORD:{noop}change-me}
