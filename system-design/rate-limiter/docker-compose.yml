services:
  rate-limiter:
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REGION: eu-central-1
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-collector:
        condition: service_started

  rate-limiter-durable:
    build: .
    profiles: ["durable"]
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: durable
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RATE_LIMITER_JDBC_URL: jdbc:postgresql://postgres:5432/rate_limiter
      RATE_LIMITER_DB_USER: rate_limiter
      RATE_LIMITER_DB_PASSWORD: local-only
      RATE_LIMITER_ADMIN_TOKEN: local-durable-admin-token
      RATE_LIMITER_IDENTITY_HMAC_SECRET: local-durable-identity-secret
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}

  rate-limiter-cluster:
    build: .
    profiles: ["cluster-app"]
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: cluster
      REDIS_CLUSTER_NODES: redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379,redis-node-6:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RATE_LIMITER_USAGE_EVENTS_ENABLED: "false"
    depends_on:
      redis-cluster-init: {condition: service_completed_successfully}
      kafka: {condition: service_started}

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  # Sześć procesów tworzy prawdziwą topologię 3 masters + 3 replicas.
  # Profil nie jest ścieżką domyślną aplikacji; służy do jawnego drillowania
  # reshardingu i failoveru przez scripts/redis-cluster-drill.sh.
  redis-node-1: &redis-cluster-node
    image: redis:7.4-alpine
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf", "--cluster-node-timeout", "3000", "--appendonly", "yes"]
    profiles: ["cluster"]
    healthcheck: &redis-cluster-health
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20
  redis-node-2:
    <<: *redis-cluster-node
  redis-node-3:
    <<: *redis-cluster-node
  redis-node-4:
    <<: *redis-cluster-node
  redis-node-5:
    <<: *redis-cluster-node
  redis-node-6:
    <<: *redis-cluster-node

  redis-cluster-init:
    image: redis:7.4-alpine
    profiles: ["cluster"]
    depends_on:
      redis-node-1: {condition: service_healthy}
      redis-node-2: {condition: service_healthy}
      redis-node-3: {condition: service_healthy}
      redis-node-4: {condition: service_healthy}
      redis-node-5: {condition: service_healthy}
      redis-node-6: {condition: service_healthy}
    command:
      - sh
      - -ec
      - >-
        redis-cli --cluster create
        redis-node-1:6379 redis-node-2:6379 redis-node-3:6379
        redis-node-4:6379 redis-node-5:6379 redis-node-6:6379
        --cluster-replicas 1 --cluster-yes

  redis-cluster-drill:
    image: redis:7.4-alpine
    profiles: ["cluster-drill"]
    depends_on:
      redis-cluster-init: {condition: service_completed_successfully}
    volumes:
      - ./scripts/redis-cluster-drill.sh:/drill.sh:ro
    command: ["sh", "/drill.sh"]

  postgres:
    image: postgres:17-alpine
    profiles: ["durable"]
    environment:
      POSTGRES_DB: rate_limiter
      POSTGRES_USER: rate_limiter
      POSTGRES_PASSWORD: local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rate_limiter"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - ./src/main/resources/db/control-plane.sql:/docker-entrypoint-initdb.d/001-control-plane.sql:ro

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - rate-limiter

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
