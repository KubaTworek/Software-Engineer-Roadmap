spring:
  application:
    name: marketplace-modular-monolith
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DATABASE_USERNAME:marketplace}
    password: ${DATABASE_PASSWORD:marketplace}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    level: "%5p correlationId=%X{correlationId:-} causationId=%X{causationId:-} eventId=%X{eventId:-} orderId=%X{orderId:-} consumer=%X{consumerName:-} topic=%X{topic:-}"

marketplace:
  events:
    mode: ${EVENTS_MODE:in-memory}
  payment-gateway:
    mode: ${PAYMENT_GATEWAY_MODE:fake-success}
  payment:
    fake:
      accept-reservations: ${PAYMENT_FAKE_ACCEPT_RESERVATIONS:true}
  kafka:
    topics:
      order-events: marketplace.order-events.v1
      payment-events: marketplace.payment-events.v1
      inventory-events: marketplace.inventory-events.v1
      fulfillment-events: marketplace.fulfillment-events.v1
      dlq: marketplace.dlq.v1
    consumer-groups:
      payment: marketplace-payment
      inventory: marketplace-inventory
      ordering: marketplace-ordering
    retry:
      max-attempts: 3
