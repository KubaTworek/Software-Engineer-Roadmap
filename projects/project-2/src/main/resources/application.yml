spring:
  application:
    name: marketplace-modular-monolith
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DATABASE_USERNAME:marketplace}
    password: ${DATABASE_PASSWORD:marketplace}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "pl.jakubtworek.marketplace.integration.kafka"
    listener:
      ack-mode: manual_immediate

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    level: "%5p correlationId=%X{correlationId:-} causationId=%X{causationId:-} eventId=%X{eventId:-} orderId=%X{orderId:-} consumer=%X{consumerName:-} topic=%X{topic:-}"

marketplace:
  grpc:
    enabled: false
    port: 9090
  security:
    # W produkcji wyłącznie z secret managera; profil secure odrzuca zbyt krótki sekret.
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: ${JWT_ISSUER:https://identity.marketplace.local}
    jwt-audience: ${JWT_AUDIENCE:marketplace-api}
  events:
    mode: ${EVENTS_MODE:in-memory}
  payment-gateway:
    mode: ${PAYMENT_GATEWAY_MODE:fake-success}
  payment:
    fake:
      accept-reservations: ${PAYMENT_FAKE_ACCEPT_RESERVATIONS:true}
  kafka:
    consumers:
      enabled: ${KAFKA_CONSUMERS_ENABLED:true}
    poll-timeout-ms: ${KAFKA_POLL_TIMEOUT_MS:1000}
    topics:
      order-events: ${KAFKA_TOPIC_ORDER_EVENTS:marketplace.order-events.v1}
      payment-events: ${KAFKA_TOPIC_PAYMENT_EVENTS:marketplace.payment-events.v1}
      inventory-events: ${KAFKA_TOPIC_INVENTORY_EVENTS:marketplace.inventory-events.v1}
      fulfillment-events: ${KAFKA_TOPIC_FULFILLMENT_EVENTS:marketplace.fulfillment-events.v1}
      dlq: ${KAFKA_TOPIC_DLQ:marketplace.dlq.v1}
    consumer-groups:
      payment: ${KAFKA_CONSUMER_GROUP_PAYMENT:marketplace-payment}
      inventory: ${KAFKA_CONSUMER_GROUP_INVENTORY:marketplace-inventory}
      ordering: ${KAFKA_CONSUMER_GROUP_ORDERING:marketplace-ordering}
      process: ${KAFKA_CONSUMER_GROUP_PROCESS:marketplace-process}
      fulfillment: ${KAFKA_CONSUMER_GROUP_FULFILLMENT:marketplace-fulfillment}
      notification: ${KAFKA_CONSUMER_GROUP_NOTIFICATION:marketplace-notification}
    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
  kafka-outbox:
    scheduled-enabled: ${KAFKA_OUTBOX_SCHEDULED_ENABLED:true}
    worker-delay-ms: ${KAFKA_OUTBOX_WORKER_DELAY_MS:5000}
  fulfillment-process:
    timeout: ${FULFILLMENT_PROCESS_TIMEOUT:PT15M}
    timeout-worker-enabled: ${FULFILLMENT_TIMEOUT_WORKER_ENABLED:true}
    timeout-worker-delay-ms: ${FULFILLMENT_TIMEOUT_WORKER_DELAY_MS:10000}
