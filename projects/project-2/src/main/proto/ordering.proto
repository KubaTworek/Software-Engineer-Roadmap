syntax = "proto3";

package marketplace.ordering.v1;
option java_multiple_files = true;
option java_package = "pl.jakubtworek.marketplace.api.grpc.contract";

service OrderingQueryService {
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
}

message GetOrderRequest { string order_id = 1; }
message GetOrderResponse {
  string order_id = 1;
  string status = 2;
  int64 version = 3;
}
