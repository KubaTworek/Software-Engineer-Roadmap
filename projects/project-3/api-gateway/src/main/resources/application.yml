spring:
  application:
    name: api-gateway

server:
  port: ${SERVER_PORT:8080}

services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  reservation:
    url: ${RESERVATION_SERVICE_URL:http://localhost:8082}
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
