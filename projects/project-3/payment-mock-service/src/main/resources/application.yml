spring:
  application:
    name: payment-mock-service

server:
  port: ${SERVER_PORT:8084}

payment:
  failure-rate: ${PAYMENT_FAILURE_RATE:0.2}
  max-delay-ms: ${PAYMENT_MAX_DELAY_MS:1500}

management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    key-values:
      service.name: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
