services:
  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 20

  reservation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 20

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orders"]
      interval: 5s
      timeout: 3s
      retries: 20

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payments"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
    ports:
      - "3200:3200"
      - "4320:4318"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4319:4318"
    profiles: ["observability-extra"]

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  catalog-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      LOG_LEVEL: INFO
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/catalog
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8081:8081"
    depends_on:
      catalog-db:
        condition: service_healthy
      redis:
        condition: service_started

  reservation-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: reservation-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      LOG_LEVEL: INFO
      SPRING_DATASOURCE_URL: jdbc:postgresql://reservation-db:5432/reservation
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      CATALOG_SERVICE_URL: http://catalog-service:8081
    ports:
      - "8082:8082"
    depends_on:
      reservation-db:
        condition: service_healthy
      catalog-service:
        condition: service_started

  order-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      LOG_LEVEL: INFO
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/orders
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_RABBITMQ_HOST: rabbitmq
      PAYMENT_SERVICE_URL: http://payment-mock-service:8084
      RESERVATION_SERVICE_URL: http://reservation-service:8082
    ports:
      - "8083:8083"
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      reservation-service:
        condition: service_started
      payment-mock-service:
        condition: service_started

  payment-mock-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: payment-mock-service/Dockerfile
    environment:
      SERVER_PORT: 8084
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      LOG_LEVEL: INFO
      PAYMENT_FAILURE_RATE: 0.0
      PAYMENT_MAX_DELAY_MS: 300
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payments
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    ports:
      - "8084:8084"
    depends_on:
      payment-db:
        condition: service_healthy

  notification-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      SERVER_PORT: 8085
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      LOG_LEVEL: INFO
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notifications
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq:
        condition: service_started
      notification-db:
        condition: service_healthy

  api-gateway:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0
      LOG_LEVEL: INFO
      CATALOG_SERVICE_URL: http://catalog-service:8081
      RESERVATION_SERVICE_URL: http://reservation-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      SPRING_DATA_REDIS_HOST: redis
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_ANON_CAPACITY: 60
      RATE_LIMIT_ANON_REFILL_TOKENS: 60
      RATE_LIMIT_ANON_REFILL_PERIOD: 60s
      # Lokalny profil k6 mierzy downstream, więc techniczny API key ma wysoki limit.
      # Limit anonimowy nadal pozwala osobno obserwować kontrolowane odpowiedzi 429.
      RATE_LIMIT_API_KEY_CAPACITY: 1000000
      RATE_LIMIT_API_KEY_REFILL_TOKENS: 1000000
      RATE_LIMIT_API_KEY_REFILL_PERIOD: 60s
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started
      catalog-service:
        condition: service_started
      reservation-service:
        condition: service_started
      order-service:
        condition: service_started

  k6:
    image: grafana/k6:0.54.0
    profiles: ["load-tests"]
    working_dir: /work
    volumes:
      - .:/work
    environment:
      BASE_URL: http://api-gateway:8080
      CATALOG_URL: http://catalog-service:8081
      PAYMENT_URL: http://payment-mock-service:8084
      NOTIFICATION_URL: http://notification-service:8085
      RABBITMQ_API_URL: http://rabbitmq:15672/api
      RABBITMQ_AUTH: guest:guest
      # Testy przepustowości używają jawnej tożsamości technicznej. Ich celem jest
      # pomiar usług; zachowanie 429 ma osobny scenariusz rate-limitera.
      API_KEY: load-test
    depends_on:
      api-gateway:
        condition: service_started
      catalog-service:
        condition: service_started
      reservation-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-mock-service:
        condition: service_started
      notification-service:
        condition: service_started
