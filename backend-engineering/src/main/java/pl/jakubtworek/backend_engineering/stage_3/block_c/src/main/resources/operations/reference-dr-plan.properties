# Measurable recovery contract, not a provider console checklist.
plan.name=orders-platform-regional-dr
region.primary=europe-west1
region.recovery=europe-central2

# RPO: at most five minutes of durable data loss. RTO: service restored in 30 minutes.
objective.rpo=PT5M
objective.rto=PT30M

backup.cloud-sql.interval=PT5M
backup.cloud-sql.retention=P35D
backup.cloud-sql.restore-drill-interval=P30D
backup.cloud-sql.point-in-time-recovery=true
backup.cloud-sql.cross-region-copy=true

failover.traffic-switch-duration=PT5M
failover.application-warmup-duration=PT10M
infrastructure.reproducible=true
identity.workload-identity=true

runbook.failover.steps=declare-incident,freeze-writes,promote-secondary,recreate-from-iac,switch-traffic,verify-critical-journeys
runbook.rollback.steps=stop-rollout,rollback-image,keep-compatible-schema,verify-critical-journeys
