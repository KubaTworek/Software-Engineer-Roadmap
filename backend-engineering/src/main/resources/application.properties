# AUTHORIZASTION

# The authorization lab provides a local, ephemeral JwtDecoder. A real Resource
# Server should configure a trusted issuer/JWKS instead of generating keys.


# JPA

spring.jpa.hibernate.ddl-auto=update
properties.hibernate.format_sql=true
show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# CONFIGURATION
spring.application.name=backend-systems-lab-stage-1
spring.profiles.active=dev

app.name=Spring Configuration Demo
app.description=Example application using YAML configuration
app.features.registration-enabled=true
app.features.experimental-ui=false
app.external-api.base-url=https://api.dev.example.com
app.external-api.api-key=${EXTERNAL_API_KEY:}
app.external-api.timeout=5s
